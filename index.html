<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6a48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Middager">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ukas middager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one column, phone first. The shopping list reads as a receipt strip; dinners are day cards. */
:root{
  --bg:#eef1ec; --paper:#fbfcf9; --ink:#17201b; --muted:#5b6a61; --line:#c9d3cb;
  --accent:#1d6a48; --accent-ink:#ffffff; --offer:#a84d15; --offer-bg:#fbe9dc; --warn:#9a3412;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1411; --paper:#171e1a; --ink:#e4ebe6; --muted:#93a399; --line:#2d3a33;
    --accent:#5cbf8c; --accent-ink:#08140e; --offer:#f2a467; --offer-bg:#3a2516; --warn:#fdba74;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px}
.kicker{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.sync{font-family:var(--f-mono);font-size:12px;text-transform:none;letter-spacing:0;white-space:nowrap}
.sync.err{color:var(--warn)}
h1{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.progress{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}
nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--line);padding:4px;border-radius:12px}
nav button{font:inherit;font-weight:700;padding:10px 8px;border-radius:9px;border:0;background:none;color:var(--ink);cursor:pointer}
nav button[aria-selected="true"]{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:15px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.note b{color:var(--ink)}
.hidden{display:none !important}

.receipt{background:var(--paper);padding:14px 16px 22px;--z:8px;
  -webkit-mask: conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/calc(2*var(--z)) 100%;
  mask: conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/calc(2*var(--z)) 100%;}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:6px}
.tools label{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);cursor:pointer}
.tools input{width:18px;height:18px;accent-color:var(--accent)}
.sec{margin-top:14px}
.sec h2{font-family:var(--f-mono);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;display:flex;align-items:center;gap:10px}
.sec h2::after{content:"";flex:1;border-top:1px dashed var(--line)}
.sec h2 .cnt{font-variant-numeric:tabular-nums}
ul.items{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:8px;border-bottom:1px dotted var(--line)}
.item:last-child{border-bottom:0}
.tick{flex:1;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;min-height:54px;padding:8px 0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;opacity:0;color:var(--accent-ink)}
.item.done .box{background:var(--accent);border-color:var(--accent)}
.item.done .box svg{opacity:1}
.nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.nm .t{font-weight:700;overflow-wrap:anywhere}
.nm .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--f-mono);font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.offer{background:var(--offer-bg);border-color:transparent;color:var(--offer);font-weight:500}
.chip.who{border-style:dashed}
.qty{font-family:var(--f-mono);font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;max-width:9.5em}
.item.done .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.item.done .qty{opacity:.6}
.del{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font-size:20px;cursor:pointer}
form.row{display:flex;gap:8px;margin-top:16px}
form.row input{flex:1;min-width:0;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{font:inherit;font-weight:700;padding:11px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.total{margin-top:16px;padding-top:12px;border-top:2px dashed var(--line);display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:15px}

.days{display:flex;flex-direction:column;gap:10px}
details.day{background:var(--paper);border-radius:14px;border:1px solid var(--line)}
details.day.today{border:2px solid var(--accent)}
details.day summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
details.day summary::-webkit-details-marker{display:none}
.dl{font-family:var(--f-mono);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);line-height:1.2}
.dl b{display:block;font-family:var(--f-display);font-size:24px;color:var(--ink);letter-spacing:0}
.dish{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2;text-wrap:balance}
.today-tag{display:inline-block;margin-left:6px;font-family:var(--f-mono);font-size:11px;font-weight:500;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);vertical-align:middle}
.min{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.body{padding:0 16px 16px;display:grid;gap:12px}
.body h3{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.body ul,.body ol{margin:0;padding-left:20px;display:grid;gap:4px}
.freeze{background:var(--paper);border-radius:14px;padding:14px 16px;border-left:5px solid var(--accent)}
.freeze h2{font-family:var(--f-display);font-size:19px;margin:0 0 6px}
.freeze ul{margin:0;padding-left:20px;display:grid;gap:4px}

.setup{background:var(--paper);border-radius:14px;padding:18px 16px;display:grid;gap:12px}
.setup h2{font-family:var(--f-display);font-size:24px;margin:0}
.setup p{margin:0;color:var(--muted)}
.setup label{font-weight:700}
.setup input{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.foot{font-size:13px;color:var(--muted);text-align:center}
.foot button{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}

/* v2 additions */
.item .have{flex:none;width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font:500 12px var(--f-mono);cursor:pointer}
.item.pantry .t{font-weight:400}
details.havebox{margin-top:16px;border-top:1px dashed var(--line);padding-top:10px}
details.havebox summary{cursor:pointer;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.havebox .item .t{color:var(--muted)}
.addwrap{position:relative}
.sugg{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);list-style:none;margin:0;padding:4px;z-index:5;max-height:50vh;overflow:auto}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;font:inherit;padding:10px;border:0;background:none;color:var(--ink);border-radius:8px;cursor:pointer}
.sugg button:hover,.sugg button.act{background:var(--bg)}
.sugg small{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.sum{margin-top:16px;padding-top:12px;border-top:2px dashed var(--line);display:grid;gap:4px;font-family:var(--f-mono);font-size:15px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .big{font-size:18px;font-weight:500;color:var(--ink)}
.sum small{color:var(--muted);font-size:12px}
.daybtns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{font:inherit;font-weight:700;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.chip.swap{border-color:var(--accent);color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.35)}
.sheet .panel{background:var(--bg);border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;padding:14px max(16px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom))}
.sheet header{flex-direction:row;justify-content:space-between;align-items:center}
.sheet h2{font-family:var(--f-display);font-size:24px;margin:0}
.sheet .panel{width:100%;max-width:560px;margin:0 auto}
.sheet .scroll{overflow:auto;display:flex;flex-direction:column;gap:12px;padding:8px 0 4px;min-width:0}
.sheet .scroll>*{flex-shrink:0;min-width:0}
.sheet h3{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;min-height:max-content}
.filters button{flex:none;font:500 13px var(--f-mono);padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sheet input[type=search]{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.rlist{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.rcard .chip{white-space:normal}
.rcard{display:grid;gap:4px;text-align:left;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.rcard.best{border-color:var(--accent)}
.rcard .rn{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2}
.rcard .rm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.good{color:var(--accent);border-color:var(--accent)}
.delta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* v3 additions */
.step{display:flex;align-items:center;gap:2px;flex:none}
.sb{width:34px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:700 20px/1 var(--f-body);cursor:pointer}
.sq{min-width:44px;text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.item.done .sq{opacity:.6}
.tick{grid-template-columns:28px 1fr}
.rm{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.src{font-size:13px;color:var(--muted);margin:0}
.src a{color:var(--accent)}
.adddays{background:var(--paper);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.adddays h3,.ov h3{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.ov{display:grid;gap:14px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{font-family:var(--f-display);font-size:26px;margin:0;text-transform:capitalize}
.ghost.sm{padding:6px 14px;font-size:20px;line-height:1}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);color:var(--muted)}
.bignum b{font-family:var(--f-display);font-size:44px;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.budgetbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.budgetbar .spent{background:var(--accent)}
.budgetbar .plan{background:var(--accent);opacity:.35}
.small{font-size:14px;color:var(--muted);margin:0}
.over{color:var(--warn);font-weight:700}
.budgetform{flex-wrap:wrap;align-items:center;margin-top:0}
.budgetform label,.lbl{flex-basis:100%;font-size:14px;color:var(--muted)}
.thisweek{background:var(--paper);border-radius:14px;padding:14px 16px;border-left:5px solid var(--accent);display:grid;gap:8px}
.thisweek h3{margin:0}
.thisweek form{flex-wrap:wrap;margin-top:0}
.pair{display:flex;justify-content:space-between;font-family:var(--f-mono)}
details.wk{background:var(--paper);border-radius:12px;border:1px solid var(--line);padding:0 14px}
details.wk summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:12px 0;font-weight:700}
.wkn{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.wkn small{color:var(--muted)}
ul.bought{margin:0 0 12px;padding-left:20px;columns:2;column-gap:20px;font-size:14px}
ul.bought small{color:var(--muted);font-family:var(--f-mono)}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker"><span id="kicker">Handleliste · Kiwi</span><span class="sync" id="sync"></span></div>
    <h1 id="title">Ukas middager</h1>
    <div class="progress"><div class="bar"><i id="barfill"></i></div><span id="count">–</span></div>
  </header>

  <!-- Setup: shown until this phone has a key and a name -->
  <section class="setup hidden" id="setup">
    <h2>Sett opp appen</h2>
    <p id="setupMsg">Åpne lenken du fikk tilsendt én gang på denne telefonen. Den inneholder nøkkelen til listen.</p>
    <form id="nameForm" class="hidden" autocomplete="off" style="display:grid;gap:10px">
      <label for="nameInput">Hva heter du?</label>
      <input id="nameInput" maxlength="20" placeholder="Fornavn">
      <button class="btn" type="submit">Ferdig</button>
    </form>
  </section>

  <div id="app" class="hidden" style="display:flex;flex-direction:column;gap:18px">
    <nav role="tablist" aria-label="Visning">
      <button role="tab" id="tab-oversikt" aria-selected="true" aria-controls="view-oversikt">Oversikt</button>
      <button role="tab" id="tab-liste" aria-selected="false" aria-controls="view-liste">Handleliste</button>
      <button role="tab" id="tab-middager" aria-selected="false" aria-controls="view-middager">Middager</button>
    </nav>

    <div class="note hidden" id="status" role="status"></div>

    <section id="view-oversikt" role="tabpanel"><div id="overview"></div></section>

    <section id="view-liste" role="tabpanel" class="hidden">
      <div class="receipt">
        <div class="tools">
          <label for="hideDone"><input type="checkbox" id="hideDone"> Skjul det som er i kurven</label>
        </div>
        <div id="sections"></div>
        <div id="haveBox"></div>
        <div class="addwrap">
          <ul class="sugg hidden" id="sugg" role="listbox" aria-label="Forslag"></ul>
          <form class="row" id="addForm" autocomplete="off">
            <label for="addInput" class="hidden">Legg til vare</label>
            <input id="addInput" placeholder="Legg til vare, f.eks. yoghurt" maxlength="80" role="combobox" aria-controls="sugg" aria-autocomplete="list" aria-expanded="false">
            <button class="btn" id="addBtn" type="submit">Legg til</button>
          </form>
        </div>
        <div class="sum" id="sum"></div>
      </div>
    </section>

    <section id="view-middager" role="tabpanel" class="hidden">
      <div class="days" id="days"></div>
    </section>

    <div class="foot"><span id="me"></span> · <button type="button" id="shareBtn">Kopier delingslenke</button></div>
  </div>
</div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="panel"><header><h2 id="sheetTitle">Bytt middag</h2><button class="ghost" type="button" id="sheetClose">Lukk</button></header><div class="scroll" id="sheetBody"></div></div></div>

<script src="lib.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
