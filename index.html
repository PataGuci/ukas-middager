<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d6a48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Middager">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ukas middager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one column, phone first. The shopping list reads as a receipt strip; dinners are day cards. */
:root{
  --bg:#eef1ec; --paper:#fbfcf9; --ink:#17201b; --muted:#5b6a61; --line:#c9d3cb;
  --accent:#1d6a48; --accent-ink:#ffffff; --offer:#a84d15; --offer-bg:#fbe9dc; --warn:#9a3412;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1411; --paper:#171e1a; --ink:#e4ebe6; --muted:#93a399; --line:#2d3a33;
    --accent:#5cbf8c; --accent-ink:#08140e; --offer:#f2a467; --offer-bg:#3a2516; --warn:#fdba74;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px}
.kicker{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.sync{font-family:var(--f-mono);font-size:12px;text-transform:none;letter-spacing:0;white-space:nowrap}
.sync.err{color:var(--warn)}
h1{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.progress{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}
nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--line);padding:4px;border-radius:12px}
nav button{font:inherit;font-weight:700;padding:10px 8px;border-radius:9px;border:0;background:none;color:var(--ink);cursor:pointer}
nav button[aria-selected="true"]{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:15px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.note b{color:var(--ink)}
.hidden{display:none !important}

.receipt{background:var(--paper);padding:14px 16px 22px;--z:8px;
  -webkit-mask: conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/calc(2*var(--z)) 100%;
  mask: conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/calc(2*var(--z)) 100%;}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:6px}
.tools label{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);cursor:pointer}
.tools input{width:18px;height:18px;accent-color:var(--accent)}
.sec{margin-top:14px}
.sec h2{font-family:var(--f-mono);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;display:flex;align-items:center;gap:10px}
.sec h2::after{content:"";flex:1;border-top:1px dashed var(--line)}
.sec h2 .cnt{font-variant-numeric:tabular-nums}
ul.items{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:8px;border-bottom:1px dotted var(--line)}
.item:last-child{border-bottom:0}
.tick{flex:1;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;min-height:54px;padding:8px 0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:16px;height:16px;opacity:0;color:var(--accent-ink)}
.item.done .box{background:var(--accent);border-color:var(--accent)}
.item.done .box svg{opacity:1}
.nm{display:flex;flex-direction:column;gap:3px;min-width:0}
.nm .t{font-weight:700;overflow-wrap:anywhere}
.nm .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--f-mono);font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.offer{background:var(--offer-bg);border-color:transparent;color:var(--offer);font-weight:500}
.chip.who{border-style:dashed}
.qty{font-family:var(--f-mono);font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;max-width:9.5em}
.item.done .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.item.done .qty{opacity:.6}
.del{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font-size:20px;cursor:pointer}
form.row{display:flex;gap:8px;margin-top:16px}
form.row input{flex:1;min-width:0;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{font:inherit;font-weight:700;padding:11px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.total{margin-top:16px;padding-top:12px;border-top:2px dashed var(--line);display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:15px}

.days{display:flex;flex-direction:column;gap:10px}
details.day{background:var(--paper);border-radius:14px;border:1px solid var(--line)}
details.day.today{border:2px solid var(--accent)}
details.day summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
details.day summary::-webkit-details-marker{display:none}
.dl{font-family:var(--f-mono);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);line-height:1.2}
.dl b{display:block;font-family:var(--f-display);font-size:24px;color:var(--ink);letter-spacing:0}
.dish{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2;text-wrap:balance}
.today-tag{display:inline-block;margin-left:6px;font-family:var(--f-mono);font-size:11px;font-weight:500;padding:1px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);vertical-align:middle}
.min{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.body{padding:0 16px 16px;display:grid;gap:12px}
.body h3{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.body ul,.body ol{margin:0;padding-left:20px;display:grid;gap:4px}
.freeze{background:var(--paper);border-radius:14px;padding:14px 16px;border-left:5px solid var(--accent)}
.freeze h2{font-family:var(--f-display);font-size:19px;margin:0 0 6px}
.freeze ul{margin:0;padding-left:20px;display:grid;gap:4px}

.setup{background:var(--paper);border-radius:14px;padding:18px 16px;display:grid;gap:12px}
.setup h2{font-family:var(--f-display);font-size:24px;margin:0}
.setup p{margin:0;color:var(--muted)}
.setup label{font-weight:700}
.setup input{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.foot{font-size:13px;color:var(--muted);text-align:center}
.foot button{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker"><span id="kicker">Handleliste · Kiwi</span><span class="sync" id="sync"></span></div>
    <h1 id="title">Ukas middager</h1>
    <div class="progress"><div class="bar"><i id="barfill"></i></div><span id="count">–</span></div>
  </header>

  <!-- Setup: shown until this phone has a key and a name -->
  <section class="setup hidden" id="setup">
    <h2>Sett opp appen</h2>
    <p id="setupMsg">Åpne lenken du fikk tilsendt én gang på denne telefonen. Den inneholder nøkkelen til listen.</p>
    <form id="nameForm" class="hidden" autocomplete="off" style="display:grid;gap:10px">
      <label for="nameInput">Hva heter du?</label>
      <input id="nameInput" maxlength="20" placeholder="Fornavn">
      <button class="btn" type="submit">Ferdig</button>
    </form>
  </section>

  <div id="app" class="hidden" style="display:flex;flex-direction:column;gap:18px">
    <nav role="tablist" aria-label="Visning">
      <button role="tab" id="tab-liste" aria-selected="true" aria-controls="view-liste">Handleliste</button>
      <button role="tab" id="tab-middager" aria-selected="false" aria-controls="view-middager">Middager</button>
    </nav>

    <div class="note hidden" id="status" role="status"></div>

    <section id="view-liste" role="tabpanel">
      <div class="receipt">
        <div class="tools">
          <label for="hideDone"><input type="checkbox" id="hideDone"> Skjul det som er i kurven</label>
        </div>
        <div id="sections"></div>
        <form class="row" id="addForm" autocomplete="off">
          <label for="addInput" class="hidden">Legg til vare</label>
          <input id="addInput" placeholder="Legg til vare, f.eks. melk" maxlength="80">
          <button class="btn" id="addBtn" type="submit">Legg til</button>
        </form>
        <div class="total" id="total"></div>
      </div>
    </section>

    <section id="view-middager" role="tabpanel" class="hidden">
      <div class="days" id="days"></div>
    </section>

    <div class="foot"><span id="me"></span> · <button type="button" id="shareBtn">Kopier delingslenke</button></div>
  </div>
</div>

<script>
(function(){
  // ---- Config: data lives in a private repo next to this public one ----
  const OWNER = (location.hostname.endsWith('.github.io') ? location.hostname.split('.')[0] : '') || localStorage.getItem('owner') || '';
  const REPO = 'ukas-middager-data';
  const API = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/';
  const POLL_MS = 6000;

  const CHECK_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const $ = id => document.getElementById(id);
  const ls = { get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(e){} }, del(k){ try{localStorage.removeItem(k);}catch(e){} } };

  // Key arrives once in the link: #k=<token>
  if (location.hash.startsWith('#k=')) {
    ls.set('ghkey', decodeURIComponent(location.hash.slice(3)));
    history.replaceState(null, '', location.pathname + location.search);
  }
  let KEY = ls.get('ghkey');
  let ME = ls.get('name');

  const S = { plan:null, planEtag:null, st:null, stSha:null, stEtag:null, queue:[], busy:false, hideDone: ls.get('hideDone')==='1', view:'liste' };
  // Show cached copy instantly (useful in a store with bad coverage)
  try { const c = JSON.parse(ls.get('cache')||'null'); if (c) { S.plan = c.plan; S.st = c.st; } } catch(e){}

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function todayISO(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function setStatus(t){ const s=$('status'); if(!t){s.classList.add('hidden');return;} s.innerHTML=t; s.classList.remove('hidden'); }
  function setSync(t,err){ const s=$('sync'); s.textContent=t; s.classList.toggle('err',!!err); }
  function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64dec(b){ return decodeURIComponent(escape(atob(b.replace(/\n/g,'')))); }
  function saveCache(){ ls.set('cache', JSON.stringify({plan:S.plan, st:S.st})); }

  // ---- Setup flow ----
  function showSetup(){
    $('setup').classList.remove('hidden'); $('app').classList.add('hidden');
    if (!KEY || !OWNER) { $('setupMsg').textContent = 'Åpne delingslenken du fikk tilsendt én gang på denne telefonen. Den inneholder nøkkelen til listen.'; $('nameForm').classList.add('hidden'); }
    else { $('setupMsg').textContent = 'Navnet vises ved det du krysser av, så dere ser hvem som har tatt hva.'; $('nameForm').classList.remove('hidden'); }
  }
  $('nameForm').addEventListener('submit', e=>{ e.preventDefault(); const v=$('nameInput').value.trim(); if(!v) return; ME=v; ls.set('name',v); boot(); });

  // ---- GitHub I/O ----
  async function gh(path, opts){
    opts = opts || {};
    const headers = Object.assign({ 'Authorization':'Bearer '+KEY, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }, opts.headers||{});
    const r = await fetch(API + path, { method: opts.method||'GET', headers, body: opts.body, cache:'no-store' });
    return r;
  }
  async function loadPlan(){
    const h = S.planEtag ? {'If-None-Match':S.planEtag} : {};
    const r = await gh('plan.json', {headers:h});
    if (r.status === 304) return false;
    if (r.status === 404) { S.plan = null; return true; }
    if (r.status === 401 || r.status === 403) throw {auth:true, status:r.status};
    if (!r.ok) throw {status:r.status};
    S.planEtag = r.headers.get('ETag');
    const j = await r.json();
    S.plan = JSON.parse(b64dec(j.content));
    return true;
  }
  async function loadState(force){
    const h = (!force && S.stEtag) ? {'If-None-Match':S.stEtag} : {};
    const r = await gh('state.json', {headers:h});
    if (r.status === 304) return false;
    if (r.status === 404) { S.st = null; S.stSha = null; S.stEtag = null; return true; }
    if (r.status === 401 || r.status === 403) throw {auth:true, status:r.status};
    if (!r.ok) throw {status:r.status};
    S.stEtag = r.headers.get('ETag');
    const j = await r.json();
    S.stSha = j.sha;
    S.st = JSON.parse(b64dec(j.content));
    return true;
  }
  function freshState(){ return { weekId: S.plan ? S.plan.weekId : '', checks:{}, extras:[] }; }
  function curState(){ return (S.st && S.plan && S.st.weekId === S.plan.weekId) ? S.st : freshState(); }

  // Ops are re-applied on top of the latest server state, so two phones never overwrite each other.
  function applyOp(st, op){
    st = JSON.parse(JSON.stringify(st));
    if (op.t==='check') { if (op.v) st.checks[op.id] = {by:ME, at:op.at}; else delete st.checks[op.id]; }
    else if (op.t==='add') { if (!st.extras.some(x=>x.id===op.x.id)) st.extras.push(op.x); }
    else if (op.t==='xcheck') { const x=st.extras.find(x=>x.id===op.id); if(x){ x.checked=op.v; x.by=ME; } }
    else if (op.t==='del') { st.extras = st.extras.filter(x=>x.id!==op.id); }
    return st;
  }
  function viewState(){ return S.queue.reduce(applyOp, curState()); }

  async function flush(){
    if (S.busy || !S.queue.length) return;
    S.busy = true; setSync('lagrer …');
    try {
      for (let attempt=0; attempt<4 && S.queue.length; attempt++){
        const ops = S.queue.slice();
        const next = ops.reduce(applyOp, curState());
        const body = { message: 'Handleliste: ' + ops.map(o=>o.t).join(','), content: b64enc(JSON.stringify(next)) };
        if (S.stSha) body.sha = S.stSha;
        const r = await gh('state.json', {method:'PUT', body: JSON.stringify(body)});
        if (r.ok) {
          const j = await r.json();
          S.st = next; S.stSha = j.content.sha; S.stEtag = null;
          S.queue = S.queue.slice(ops.length);
          saveCache();
        } else if (r.status === 409 || r.status === 422) {
          await loadState(true); // someone else saved first: rebase and retry
        } else if (r.status === 401 || r.status === 403) { throw {auth:true}; }
        else { throw {status:r.status}; }
      }
      setSync(S.queue.length ? 'ikke lagret' : 'lagret', !!S.queue.length);
    } catch(e) {
      setSync(e && e.auth ? 'nøkkel avvist' : 'frakoblet – prøver igjen', true);
    } finally { S.busy = false; render(); }
  }
  function enqueue(op){ op.at = new Date().toISOString(); S.queue.push(op); render(); flush(); }

  async function poll(){
    if (document.hidden) return;
    try {
      const a = await loadPlan();
      const b = await loadState(false);
      if (a || b) { saveCache(); render(); }
      if (!S.queue.length) setSync('oppdatert ' + new Date().toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'}));
      setStatus(S.plan ? '' : 'Ingen liste ennå. Ukas liste kommer søndag kveld.');
      flush();
    } catch(e) {
      if (e && e.auth) setStatus('Nøkkelen ble avvist. Den kan ha utløpt. Be om en ny delingslenke.');
      setSync('frakoblet', true);
    }
  }

  // ---- Render ----
  function render(){
    const p = S.plan; const st = viewState();
    $('me').textContent = ME ? 'Du er ' + ME : '';
    $('tab-liste').setAttribute('aria-selected', S.view==='liste');
    $('tab-middager').setAttribute('aria-selected', S.view==='middager');
    $('view-liste').classList.toggle('hidden', S.view!=='liste');
    $('view-middager').classList.toggle('hidden', S.view!=='middager');
    if (!p) { $('sections').innerHTML=''; $('days').innerHTML=''; $('count').textContent='–'; $('total').innerHTML=''; return; }
    $('kicker').textContent = (p.weekLabel||'') + (p.dates ? ' · '+p.dates : '') + ' · Kiwi';
    $('title').textContent = p.title || 'Ukas middager';

    const items = []; (p.sections||[]).forEach(s=>(s.items||[]).forEach(i=>items.push(i)));
    const isDone = id => !!st.checks[id];
    const done = items.filter(i=>isDone(i.id)).length + st.extras.filter(x=>x.checked).length;
    const total = items.length + st.extras.length;
    $('count').textContent = done + ' av ' + total;
    $('barfill').style.width = total ? (100*done/total)+'%' : '0';

    const who = by => (by && by !== ME) ? '<span class="chip who">'+esc(by)+'</span>' : '';
    let h = '';
    (p.sections||[]).forEach(sec=>{
      const its = sec.items||[];
      const vis = its.filter(i=>!(S.hideDone && isDone(i.id)));
      if (S.hideDone && !vis.length) return;
      h += '<div class="sec"><h2>'+esc(sec.name)+' <span class="cnt">'+its.filter(i=>isDone(i.id)).length+'/'+its.length+'</span></h2><ul class="items">';
      vis.forEach(i=>{
        const d = isDone(i.id); let m='';
        if (i.offer) m += '<span class="chip offer">tilbud '+esc(i.offer)+'</span>';
        if (i.pantry) m += '<span class="chip">sjekk skapet</span>';
        if (i.note) m += '<span class="chip">'+esc(i.note)+'</span>';
        if (d) m += who(st.checks[i.id].by);
        h += '<li class="item'+(d?' done':'')+'"><button class="tick" type="button" data-item="'+esc(i.id)+'" aria-pressed="'+d+'"><span class="box">'+CHECK_SVG+'</span><span class="nm"><span class="t">'+esc(i.name)+'</span>'+(m?'<span class="meta">'+m+'</span>':'')+'</span><span class="qty">'+esc(i.qty||'')+'</span></button></li>';
      });
      h += '</ul></div>';
    });
    const ex = st.extras.filter(x=>!(S.hideDone && x.checked));
    if (st.extras.length && ex.length){
      h += '<div class="sec"><h2>Lagt til <span class="cnt">'+st.extras.filter(x=>x.checked).length+'/'+st.extras.length+'</span></h2><ul class="items">';
      ex.forEach(x=>{
        const m = who(x.addedBy && !x.checked ? x.addedBy : (x.checked ? x.by : ''));
        h += '<li class="item'+(x.checked?' done':'')+'"><button class="tick" type="button" data-extra="'+esc(x.id)+'" aria-pressed="'+!!x.checked+'"><span class="box">'+CHECK_SVG+'</span><span class="nm"><span class="t">'+esc(x.name)+'</span>'+(m?'<span class="meta">'+m+'</span>':'')+'</span><span class="qty"></span></button><button class="del" type="button" data-del="'+esc(x.id)+'" aria-label="Fjern '+esc(x.name)+'">×</button></li>';
      });
      h += '</ul></div>';
    }
    $('sections').innerHTML = h;
    $('total').innerHTML = p.price ? '<span>Anslått sum</span><span>'+esc(p.price)+'</span>' : '';
    $('total').classList.toggle('hidden', !p.price);

    const today = todayISO(); let dh = '';
    if (p.offerStatus) dh += '<div class="note">'+esc(p.offerStatus)+'</div>';
    (p.days||[]).forEach(d=>{
      const t = d.date === today;
      dh += '<details class="day'+(t?' today':'')+'"'+(t?' open':'')+' id="dag-'+esc(d.key||'')+'"><summary><span class="dl">'+esc((d.label||'').slice(0,3))+'<b>'+(d.date?Number(d.date.slice(8,10)):'')+'</b></span><span class="dish">'+esc(d.dish)+(t?'<span class="today-tag">i dag</span>':'')+'</span><span class="min">'+(d.minutes?esc(d.minutes)+' min':'')+'</span></summary><div class="body">'+
        ((d.ingredients||[]).length?'<div><h3>Ingredienser</h3><ul>'+d.ingredients.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'')+
        ((d.steps||[]).length?'<div><h3>Slik gjør du</h3><ol>'+d.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>':'')+'</div></details>';
    });
    const fl = [...(p.freeze||[]), ...(p.leftovers||[])];
    if (fl.length) dh += '<div class="freeze"><h2>Frys og rester</h2><ul>'+fl.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
    // keep open/closed state of day cards across re-renders
    const open = new Set([...document.querySelectorAll('details.day')].filter(d=>d.open).map(d=>d.id));
    const hadAny = document.querySelectorAll('details.day').length > 0;
    $('days').innerHTML = dh;
    if (hadAny) document.querySelectorAll('details.day').forEach(d=>{ d.open = open.has(d.id); });
  }

  // ---- Events ----
  $('tab-liste').addEventListener('click', ()=>{ S.view='liste'; render(); });
  $('tab-middager').addEventListener('click', ()=>{ S.view='middager'; render(); });
  $('hideDone').checked = S.hideDone;
  $('hideDone').addEventListener('change', e=>{ S.hideDone = e.target.checked; ls.set('hideDone', S.hideDone?'1':'0'); render(); });
  $('sections').addEventListener('click', e=>{
    const t = e.target.closest('[data-item],[data-extra],[data-del]'); if (!t || !S.plan) return;
    const st = viewState();
    if (t.dataset.item) enqueue({t:'check', id:t.dataset.item, v: !st.checks[t.dataset.item]});
    else if (t.dataset.extra) { const x = st.extras.find(x=>x.id===t.dataset.extra); if (x) enqueue({t:'xcheck', id:x.id, v:!x.checked}); }
    else if (t.dataset.del) enqueue({t:'del', id:t.dataset.del});
  });
  $('addForm').addEventListener('submit', e=>{
    e.preventDefault(); const v = $('addInput').value.trim(); if (!v || !S.plan) return;
    enqueue({t:'add', x:{ id: 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:v, checked:false, addedBy:ME }});
    $('addInput').value='';
  });
  $('shareBtn').addEventListener('click', async ()=>{
    const link = location.origin + location.pathname + '#k=' + encodeURIComponent(KEY);
    try { await navigator.clipboard.writeText(link); $('shareBtn').textContent = 'Lenke kopiert – send den til den andre'; }
    catch(e){ $('shareBtn').textContent = 'Kunne ikke kopiere'; }
    setTimeout(()=>{ $('shareBtn').textContent='Kopier delingslenke'; }, 4000);
  });
  document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) poll(); });
  window.addEventListener('online', ()=>{ flush(); poll(); });

  let timer = null;
  function boot(){
    if (!KEY || !OWNER || !ME) { showSetup(); return; }
    $('setup').classList.add('hidden'); $('app').classList.remove('hidden');
    render(); poll();
    if (!timer) timer = setInterval(poll, POLL_MS);
  }
  boot();
})();
</script>
</body>
</html>
